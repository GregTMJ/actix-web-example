services:
  mock_service_pg:
    container_name: mock_service_pg 
    image: postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]

  app:
    container_name: mock_service_app
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      mock_service_pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ping"]
      interval: 10s
      timeout: 30s
      retries: 5
